window.onerror=function(m,u,l){var b=document.getElementById('errBox');if(b){b.style.display='block';b.innerHTML='脚本错误：'+m+'（第 '+l+' 行）。请确认代码复制完整，并以 UTF-8 编码保存。';}};
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --fd:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --fb:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --fm:ui-monospace,"SF Mono",Consolas,"Courier New",monospace;
  --bg:#f4f6f1;--surface:#fff;--surface2:#eef4ec;
  --ink:#1a2420;--ink2:#3d4a44;--muted:#6d7a73;
  --pri:#0e5c44;--pri-ink:#0a4a37;--on-pri:#f0f8f4;
  --acc:#d99a2b;--acc-ink:#8a6210;--acc-soft:rgba(217,154,43,.12);
  --line:rgba(14,92,68,.2);--line-s:rgba(14,92,68,.09);
  --nav-bg:rgba(244,246,241,.9);
  --sh:0 1px 3px rgba(20,40,30,.06),0 8px 24px -12px rgba(20,40,30,.18);
  --lift:0 4px 8px rgba(20,40,30,.08),0 16px 36px -16px rgba(20,40,30,.28);
}
[data-theme="dark"]{
  --bg:#0d1411;--surface:#151e19;--surface2:#1a2620;
  --ink:#e6efe9;--ink2:#c0cfc6;--muted:#8a9e93;
  --pri:#5cc99e;--pri-ink:#80dcb9;--on-pri:#08130e;
  --acc:#e8b455;--acc-ink:#e8b455;--acc-soft:rgba(232,180,85,.12);
  --line:rgba(92,201,158,.22);--line-s:rgba(92,201,158,.09);
  --nav-bg:rgba(13,20,17,.86);
  --sh:0 1px 3px rgba(0,0,0,.4),0 10px 26px -12px rgba(0,0,0,.6);
  --lift:0 4px 8px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.7);
}
html{scroll-padding-top:76px}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75;overflow-x:hidden;transition:background .3s,color .3s}
/* 分层背景：网格 + 氛围光 */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(900px 500px at 85% -5%,var(--acc-soft),transparent 60%),
  radial-gradient(800px 600px at -10% 30%,rgba(14,92,68,.07),transparent 55%),
  linear-gradient(var(--line-s) 1px,transparent 1px),
  linear-gradient(90deg,var(--line-s) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px}
/* 漂浮代码符号 */
.bg-glyph{position:fixed;z-index:-1;font-family:var(--fm);font-weight:700;color:var(--pri);opacity:.05;user-select:none;pointer-events:none;animation:drift 14s ease-in-out infinite}
.g1{font-size:170px;top:16%;left:-40px}
.g2{font-size:140px;bottom:8%;right:-16px;animation-delay:4s}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(4deg)}}
.wm{position:fixed;top:20px;right:-2vw;z-index:-1;font-family:var(--fd);font-size:min(36vw,420px);line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--line);opacity:.35;user-select:none;pointer-events:none}
::selection{background:var(--pri);color:var(--on-pri)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{width:min(1040px,92%);margin:0 auto}
.ic{display:inline-flex;width:1em;height:1em;flex:none;vertical-align:-.12em}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 导航 */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-s)}
.nav-in{display:flex;align-items:center;gap:16px;height:60px}
.prog{position:fixed;top:60px;left:0;right:0;height:2px;z-index:99;pointer-events:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--acc))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-m{width:33px;height:33px;border-radius:9px;background:linear-gradient(135deg,#0e5c44,#0a4634);color:#fff;font-family:var(--fd);font-size:17px;font-weight:700;display:grid;place-items:center}
.brand-t b{font-family:var(--fd);font-size:15px;letter-spacing:1.5px;display:block;line-height:1.2}
.brand-t i{font-style:normal;font-family:var(--fm);font-size:9px;color:var(--muted);letter-spacing:1.2px}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nl{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:7px;white-space:nowrap;transition:color .2s,background .2s}
.nl:hover{color:var(--ink);background:var(--line-s)}
.nl.on{color:var(--pri-ink);font-weight:600}
.nav-act{display:flex;gap:7px;flex:none}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:transform .2s,border-color .2s,color .2s}
.ib:hover{color:var(--pri-ink);border-color:var(--pri);transform:translateY(-1px)}
.ib .ic{width:15px;height:15px}

/* 按钮 / 徽章 */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid transparent;cursor:pointer;text-decoration:none;font-family:inherit;transition:transform .18s,box-shadow .18s,border-color .18s,color .18s}
.btn .ic{width:14px;height:14px}
.btn.p{background:var(--pri);color:var(--on-pri)}
.btn.p:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(14,92,68,.5)}
.btn.g{background:var(--surface);border-color:var(--line);color:var(--ink2)}
.btn.g:hover{border-color:var(--pri);color:var(--pri-ink);transform:translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--fm);font-size:11.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
.tchip{font-family:var(--fm);font-size:11px;color:var(--pri-ink);background:var(--acc-soft);border:1px solid var(--line);padding:4px 10px;border-radius:99px;white-space:nowrap}

/* Hero */
.hero{padding:118px 0 56px}
.hero-g{display:grid;grid-template-columns:1.08fr .92fr;gap:44px;align-items:center}
.eyebrow{font-family:var(--fm);font-size:11.5px;letter-spacing:.6px;color:var(--pri-ink);display:inline-flex;align-items:center;gap:7px;background:var(--acc-soft);border:1px solid var(--line);padding:5px 12px;border-radius:99px;margin-bottom:16px}
.pulse{width:7px;height:7px;border-radius:50%;background:#2fae72;display:inline-block;animation:pu 2s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(47,174,114,.5)}70%{box-shadow:0 0 0 7px rgba(47,174,114,0)}100%{box-shadow:0 0 0 0 rgba(47,174,114,0)}}
.h-name{font-family:var(--fd);font-size:clamp(2.8rem,7vw,4.2rem);line-height:1.1;letter-spacing:3px;margin-bottom:8px}
.h-sub{font-family:var(--fm);font-size:12.5px;color:var(--muted);margin-bottom:18px}
.h-sum{font-size:14.5px;line-height:2;color:var(--ink2);max-width:52ch;margin-bottom:18px}
.h-cta{display:flex;flex-wrap:wrap;gap:9px}
.h-st{margin-top:16px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
/* 终端 */
.h-right{position:relative}
.term{background:#0b1611;border:1px solid rgba(92,201,158,.25);border-radius:13px;overflow:hidden;font-family:var(--fm);box-shadow:0 22px 50px -22px rgba(8,38,26,.6);position:relative;z-index:1}
.t-bar{display:flex;align-items:center;gap:6px;padding:10px 13px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07)}
.td{width:10px;height:10px;border-radius:50%}.td.r{background:#ff5f57}.td.y{background:#febc2e}.td.g{background:#28c840}
.t-title{margin-left:7px;font-size:11px;color:#7d948a}
.t-body{padding:16px 16px 22px;font-size:12.5px;line-height:2;color:#c9dccf;min-height:196px}
.tl{white-space:pre-wrap;word-break:break-all;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.tl.show{opacity:1;transform:none}
.tu{color:#7ee2b8}.tp{color:#e9b455}.ts{color:#8fe6c0}.tdim{color:#8aa396}.tc{color:#e6efe9}.tok{color:#7ee2b8}
.typing .tl:last-child::after{content:"▍";color:#e9b455;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
/* 一卡通 */
.idcard{position:relative;z-index:2;width:340px;max-width:100%;margin:-58px 0 0 -18px;border-radius:16px;padding:18px 22px 16px;color:#eaf6ef;background:linear-gradient(135deg,#0d5c44 0%,#0a4634 55%,#11694e 100%);box-shadow:0 24px 50px -18px rgba(8,38,26,.55);transform:rotate(-2.5deg);transition:transform .35s}
.idcard:hover{transform:rotate(0) translateY(-4px)}
.idcard::before{content:"";position:absolute;inset:0;border-radius:16px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.id-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.id-crest{width:40px;height:40px;flex:none}
.id-uni b{display:block;font-size:14px;letter-spacing:3px}
.id-uni i{display:block;font-style:normal;font-family:var(--fm);font-size:8px;letter-spacing:1px;opacity:.7}
.id-chip{width:36px;height:26px;border-radius:5px;background:linear-gradient(135deg,#e9c46a,#c9962e);position:relative;margin-bottom:12px}
.id-chip::after{content:"";position:absolute;inset:5px 4px;border:1px solid rgba(120,80,10,.55);border-radius:3px}
.id-row{display:flex;gap:24px;margin-bottom:10px;flex-wrap:wrap}
.id-f i{display:block;font-style:normal;font-family:var(--fm);font-size:9px;opacity:.65;letter-spacing:1px}
.id-f b{font-size:14px;letter-spacing:1px}
.id-led{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--fm);margin-bottom:12px}
.id-led span{width:7px;height:7px;border-radius:50%;background:#7ef0b2;box-shadow:0 0 6px #7ef0b2;animation:pu 2s infinite}
.id-bot{display:flex;align-items:center;gap:12px}
.id-bar{flex:1;height:24px;border-radius:2px;opacity:.85;background:repeating-linear-gradient(90deg,#eaf6ef 0 2px,transparent 2px 5px,#eaf6ef 5 6px,transparent 6px 10px)}
.id-code{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;opacity:.75;white-space:nowrap}

/* 通用 Section */
.sec{padding:52px 0}
.sh{display:flex;align-items:flex-end;gap:14px;margin-bottom:28px}
.sn{font-family:var(--fm);font-size:12px;color:var(--acc-ink);border:1px solid var(--line);padding:3px 8px;border-radius:6px;transform:translateY(-6px)}
.se{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.sc{font-family:var(--fd);font-size:clamp(1.5rem,3vw,2rem);font-weight:700;letter-spacing:1px}
.sr{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line-s);border-radius:14px;padding:22px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--acc));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.card:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:var(--lift)}
.card:hover::before{transform:scaleX(1)}

/* 亮点：认证横幅 + 数字条目 */
.cert{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:20px 24px;box-shadow:var(--sh);margin-bottom:26px;transition:transform .2s,box-shadow .2s}
.cert:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.seal{width:64px;height:64px;flex:none}
.cert-t{font-family:var(--fd);font-size:1.15rem;letter-spacing:.5px;margin-bottom:4px}
.cert-d{font-size:13px;color:var(--ink2);line-height:1.8}
.cert-r{margin-left:auto;flex:none;text-align:right}
.hl-strip{display:flex;gap:26px;flex-wrap:wrap}
.hl-item{flex:1;min-width:210px;padding-left:18px;border-left:1px solid var(--line)}
.hl-num{font-family:var(--fd);font-size:2rem;color:var(--acc);line-height:1;margin-bottom:6px}
.hl-t{font-weight:700;font-size:14px;margin-bottom:4px}
.hl-d{font-size:12.5px;color:var(--muted);line-height:1.8}

/* 时间线 */
.tline{border-left:2px solid var(--line);margin-left:6px}
.ti{position:relative;padding:0 0 30px 26px}
.ti:last-child{padding-bottom:4px}
.ti::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--pri);transition:transform .2s,border-color .2s}
.ti:hover::before{transform:scale(1.2);border-color:var(--acc)}
.ti.future::before{border-style:dashed;border-color:var(--muted)}
.ti-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ti-r{font-family:var(--fd);font-size:1.1rem;letter-spacing:.5px;margin-bottom:3px}
.ti-o{font-size:12.5px;color:var(--muted)}
.ti-p{list-style:none}
.ti-p li{position:relative;padding:0 0 8px 18px;font-size:14px;line-height:1.85;color:var(--ink2)}
.ti-p li::before{content:"▸";position:absolute;left:0;top:0;color:var(--acc-ink)}

/* 技能：加载中进度条 */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.sk-g h3{font-family:var(--fd);font-size:1rem;letter-spacing:.8px;display:flex;align-items:center;gap:9px;margin-bottom:16px}
.sk-g h3 .ic{width:16px;height:16px;color:var(--acc-ink)}
.sk-i{margin-bottom:15px}
.sk-i:last-child{margin-bottom:0}
.sk-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sk-n{font-size:13px;font-weight:600}
.sk-pct{font-family:var(--fm);font-size:10.5px;color:var(--acc-ink)}
.bar{height:8px;border-radius:99px;background:var(--line-s);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--acc));position:relative;transition:width 1.1s cubic-bezier(.22,.8,.36,1)}
.bar i.learn::after{content:"";position:absolute;inset:0;border-radius:99px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 6px,transparent 6px 12px);animation:stripes 1s linear infinite}
@keyframes stripes{to{background-position:17px 0}}
.rv.in .bar i{width:var(--w)}

/* 教育 */
.edu-g{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
.edu-s{font-family:var(--fd);font-size:1.35rem;letter-spacing:1px;margin-bottom:4px}
.edu-m{font-size:13.5px;color:var(--ink2);margin-bottom:10px}
.edu-b{margin-top:14px}
.edu-b h4{font-size:11px;font-family:var(--fm);letter-spacing:1.2px;color:var(--muted);margin-bottom:8px}
.aw-r{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px dashed var(--line)}
.aw-r:last-child{border-bottom:none;padding-bottom:0}
.aw-y{font-family:var(--fm);font-size:11px;color:var(--acc-ink);background:var(--acc-soft);border:1px solid var(--line);padding:3px 8px;border-radius:6px;flex:none;margin-top:2px}
.aw-r>.ic{width:17px;height:17px;color:var(--pri);flex:none;margin-top:3px}
.aw-n{font-size:13.5px;font-weight:700}
.aw-d{font-size:12px;color:var(--muted);margin-top:2px}

/* 关于我 */
.ab-w{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
.ab-m{font-family:var(--fd);font-size:4.5rem;line-height:.8;color:var(--acc);opacity:.8}
.ab-l{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 30px}
.ab-l li{display:flex;gap:11px;font-size:13.5px;line-height:1.9;color:var(--ink2);padding:14px 2px;border-bottom:1px dashed var(--line)}
.ab-l .ic{width:15px;height:15px;color:var(--acc-ink);flex:none;margin-top:5px}
.ab-l b{color:var(--pri-ink)}

/* 页脚等 */
.ft{border-top:1px solid var(--line-s);padding:22px 0 30px;margin-top:16px}
.ft-in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ft a{color:var(--pri-ink);text-decoration:none}
.bt{position:fixed;right:20px;bottom:20px;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--pri-ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:90}
.bt.show{opacity:1;transform:none;pointer-events:auto}
.bt:hover{border-color:var(--pri);transform:translateY(-2px)}
.bt .ic{width:17px;height:17px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);background:var(--surface);border:1px solid var(--pri);color:var(--ink);padding:10px 18px;border-radius:10px;box-shadow:var(--lift);font-size:13px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ic{width:14px;height:14px;color:var(--pri)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none}
  .rv .bar i{width:var(--w)}
}
@media(max-width:900px){
  .hero{padding:104px 0 44px}
  .hero-g{grid-template-columns:1fr;gap:34px}
  .edu-g{grid-template-columns:1fr}
  .ab-l{grid-template-columns:1fr}
}
@media(max-width:640px){
  .brand-t i{display:none}
  .nl{padding:6px 7px;font-size:12px}
  .ab-w{grid-template-columns:1fr}
  .ab-m{font-size:3rem}
  .idcard{margin:-44px 6px 0 6px;transform:rotate(-1.5deg)}
  .cert{flex-direction:column;align-items:flex-start}
  .cert-r{margin-left:0;text-align:left}
}
/* 游戏预览卡片 */
.game-card{background:var(--surface);border:1px solid var(--line-s);border-radius:14px;padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.game-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--pri));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.game-card:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:var(--lift)}
.game-card:hover::before{transform:scaleX(1)}
.game-intro{font-size:13.5px;color:var(--ink2);line-height:1.9;margin-bottom:14px;padding:0 4px}

/* 终端逐行输出（安全的定时器写法） */
function typeTerm(body,term){
  var lines=[
    '<span class="tu">yanpingping@nju</span>:<span class="tdim">~</span>$ <span class="tp">whoami</span>',
    '<span class="tc">闫平平 — 2026 级 · 计算机科学与技术</span>',
    '<span class="tu">yanpingping@nju</span>:<span class="tdim">~</span>$ <span class="tp">cat goals.txt</span>',
    '<span class="ts">"打好编程基础 → 参与项目竞赛 → 独立开发产品"</span>',
    '<span class="tu">yanpingping@nju</span>:<span class="tdim">~</span>$ <span class="tp">status --now</span>',
    '<span class="tok">●</span> <span class="tc">'+R.status+'</span>'
  ];
  var i=0;
  if(rm || !body){
    if(body){
      for(i=0;i<lines.length;i++){body.appendChild(ce("div","tl show",lines[i]))}
    }
    return;
  }
  term.className+=" typing";
  var timer=window.setInterval(function(){
    if(i>=lines.length){
      window.clearInterval(timer);
      term.className=term.className.replace(" typing","");
      return;
    }
    body.appendChild(ce("div","tl show",lines[i]));
    i++;
  },420);
}

/* ================= 灯箱 ================= */
var lbCurIdx=0;
function openLightbox(idx){
  if(!R.certPhotos||!R.certPhotos.length)return;
  lbCurIdx=idx;
  var lb=$("lightbox");
  if(!lb){
    lb=ce("div","lightbox");
    lb.id="lightbox";
    lb.innerHTML='<button class="lightbox-close" aria-label="关闭">&times;</button><button class="lightbox-prev" aria-label="上一张">&lsaquo;</button><img src="" alt=""><button class="lightbox-next" aria-label="下一张">&rsaquo;</button>';
    document.body.appendChild(lb);
    lb.querySelector(".lightbox-close").onclick=function(){lb.className="lightbox"};
    lb.querySelector(".lightbox-prev").onclick=function(){openLightbox((lbCurIdx-1+R.certPhotos.length)%R.certPhotos.length)};
    lb.querySelector(".lightbox-next").onclick=function(){openLightbox((lbCurIdx+1)%R.certPhotos.length)};
    lb.addEventListener("click",function(e){if(e.target===lb){lb.className="lightbox"}});
    document.addEventListener("keydown",function(e){
      if(lb.className.indexOf("show")<0)return;
      if(e.key==="Escape"){lb.className="lightbox"}
      if(e.key==="ArrowLeft"){openLightbox((lbCurIdx-1+R.certPhotos.length)%R.certPhotos.length)}
      if(e.key==="ArrowRight"){openLightbox((lbCurIdx+1)%R.certPhotos.length)}
    });
  }
  lb.querySelector("img").src=R.certPhotos[idx].src;
  lb.querySelector("img").alt=R.certPhotos[idx].label;
  lb.className="lightbox show";
}

  var tkModal=null, tkIframe=null, tkHint=null;
  function openTank(){
    if(!tkModal){
      tkModal=ce("div","game-modal");
      tkModal.id="tankModal";
      var inner=ce("div","game-modal-inner");
      tkIframe=ce("iframe");
      tkIframe.src="tank-battle.html";
      tkIframe.title="坦克大战 YPP";
      tkIframe.setAttribute("allow","autoplay");
      inner.appendChild(tkIframe);

      tkHint.innerHTML='<span>'+ic("play")+' 点击画面开始操作</span>';
      inner.appendChild(tkHint);
      tkHint.onclick=function(e){
        e.stopPropagation();
        try{tkIframe.contentWindow.focus()}catch(err){}
        tkHint.className="game-focus-hint fading";
      };
      tkIframe.onload=function(){
        try{tkIframe.contentWindow.focus()}catch(err){}
      };
      var closeBtn=ce("button","game-modal-close",ic("close")+' 关闭');

      closeBtn.onclick=closeTank;
      tkModal.addEventListener("click",function(e){if(e.target===tkModal)closeTank()});
      document.body.appendChild(tkModal);
    }else{
      tkHint.className="game-focus-hint";
    }
    tkModal.className="game-modal show";
    setTimeout(function(){try{tkIframe.contentWindow.focus()}catch(err){}},500);
  }

    if(!tkModal)return;
    tkModal.className="game-modal";
    if(tkIframe){tkIframe.src=tkIframe.src} /* 重载以停止游戏循环 */
  }
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&tkModal&&tkModal.className.indexOf("show")>=0)closeTank();
  });

  if(!w)return; // 该区块已改为内嵌 iframe 展示，此历史构建脚本不再使用

  var intro=ce("div","game-intro",ic("spark")+" 这是我用 <b>HTML5 Canvas + JavaScript</b> 独立开发的星际战机射击游戏，支持键盘/鼠标/触屏操作，包含多种武器、BOSS战和道具系统。点击下方预览画面即可全屏畅玩！");
  card.appendChild(intro);

  /* 预览区 */
  var preview=ce("div","game-preview");
  // 生成星星
  var starCount=28;
  var stars='';
  for(var si=0;si<starCount;si++){
    var sx=Math.random()*100; var sy=Math.random()*100;
    var ss=(Math.random()*2.5+1).toFixed(1);
    var sd=(Math.random()*2+1).toFixed(1);
    stars+='<span class="game-preview-star" style="left:'+sx+'%;top:'+sy+'%;width:'+ss+'px;height:'+ss+'px;animation-delay:'+sd+'s"></span>';
  }
  preview.innerHTML=
    stars+
    '<div class="game-preview-inner">'+
      '<span class="game-preview-title">星际战机</span>'+
      '<span class="game-preview-sub">STAR FIGHTER</span>'+
    '</div>'+
    '<div class="game-preview-overlay"></div>'+
    '<button class="game-preview-btn">'+ic("play")+' 点击开始游戏</button>';
  card.appendChild(preview);
  w.appendChild(card);

  /* 操作提示 */
  var ctrls=ce("div","game-controls");
  ctrls.innerHTML=
    '<span class="game-tip">WASD / 方向键 移动</span>'+
    '<span class="game-tip">空格 射击</span>'+
    '<span class="game-tip">Q 必杀技</span>'+
    '<span class="game-tip">P / Esc 暂停</span>'+
    '<span class="game-tip">支持鼠标/触屏</span>';
  card.appendChild(ctrls);

  /* 全屏游戏模态框 */
  var gameModal=null;
  var gameIframe=null;
  var focusHint=null;
  var LOG_PREFIX="[GameModal]";

  function openGame(){
    console.log(LOG_PREFIX,"openGame() 触发",new Date().toISOString());
    console.log(LOG_PREFIX,"  document.activeElement:",document.activeElement&&document.activeElement.tagName);
    console.log(LOG_PREFIX,"  gameModal 已存在:",!!gameModal);

    if(!gameModal){
      console.log(LOG_PREFIX,"  首次创建模态框 DOM ...");
      gameModal=ce("div","game-modal");
      gameModal.id="gameModal";
      var inner=ce("div","game-modal-inner");
      gameIframe=ce("iframe");
      gameIframe.src="index.html";
      gameIframe.title="星际战机";
      gameIframe.setAttribute("allow","autoplay");
      console.log(LOG_PREFIX,"  iframe.src 已设置:",gameIframe.src);
      inner.appendChild(gameIframe);
      console.log(LOG_PREFIX,"  iframe 已挂载到 inner");

      /* 点击聚焦提示层 */
      focusHint=ce("div","game-focus-hint");
      focusHint.innerHTML='<span>'+ic("play")+' 点击画面开始操作</span>';
      inner.appendChild(focusHint);
      console.log(LOG_PREFIX,"  focusHint 已创建并挂载");

      /* 点击提示层时聚焦 iframe */
      focusHint.onclick=function(e){
        console.log(LOG_PREFIX,"  focusHint.onclick 触发");
        e.stopPropagation();
        try{
          if(gameIframe&&gameIframe.contentWindow){
            gameIframe.contentWindow.focus();
            console.log(LOG_PREFIX,"  focusHint → contentWindow.focus() 成功");
            console.log(LOG_PREFIX,"  当前 activeElement:",document.activeElement&&document.activeElement.tagName);
          }else{
            console.warn(LOG_PREFIX,"  focusHint → gameIframe 或 contentWindow 不存在");
          }
        }catch(err){
          console.error(LOG_PREFIX,"  focusHint → contentWindow.focus() 失败:",err.message);
        }
        focusHint.className="game-focus-hint fading";
        console.log(LOG_PREFIX,"  focusHint 已添加 fading 类，准备渐隐");
      };

      /* iframe 加载完成时自动聚焦 */
      gameIframe.onload=function(){
        console.log(LOG_PREFIX,"  iframe.onload 触发");
        try{
          if(gameIframe.contentWindow){
            gameIframe.contentWindow.focus();
            console.log(LOG_PREFIX,"  iframe.onload → contentWindow.focus() 成功");
          }
        }catch(err){
          console.error(LOG_PREFIX,"  iframe.onload → contentWindow.focus() 失败:",err.message);
        }
      };

      var closeBtn=ce("button","game-modal-close",ic("close")+' 关闭');
      gameModal.appendChild(inner);
      gameModal.appendChild(closeBtn);
      console.log(LOG_PREFIX,"  模态框 DOM 完整，已挂载 closeBtn");

      closeBtn.onclick=function(){
        console.log(LOG_PREFIX,"  closeBtn.onclick 触发 → closeGame()");
        closeGame();
      };
      gameModal.addEventListener("click",function(e){
        if(e.target===gameModal){
          console.log(LOG_PREFIX,"  遮罩点击 → closeGame()");
          closeGame();
        }
      });
      document.body.appendChild(gameModal);
      console.log(LOG_PREFIX,"  模态框已挂载到 document.body");
    } else {
      console.log(LOG_PREFIX,"  复用已有模态框，重置 focusHint");
      if(focusHint){focusHint.className="game-focus-hint"}
    }

    console.log(LOG_PREFIX,"  添加 .show 类 → 触发 CSS 渐入动画");
    gameModal.className="game-modal show";

    /* 延迟聚焦 */
    console.log(LOG_PREFIX,"  启动 500ms 延迟聚焦定时器 ...");
    setTimeout(function(){
      console.log(LOG_PREFIX,"  延迟聚焦定时器触发 (500ms)");
      try{
        if(gameIframe&&gameIframe.contentWindow){
          gameIframe.contentWindow.focus();
          console.log(LOG_PREFIX,"  延迟聚焦 → contentWindow.focus() 成功");
          console.log(LOG_PREFIX,"  当前 activeElement:",document.activeElement&&document.activeElement.tagName);
        }else{
          console.warn(LOG_PREFIX,"  延迟聚焦 → gameIframe/contentWindow 不可用");
        }
      }catch(err){
        console.error(LOG_PREFIX,"  延迟聚焦 → contentWindow.focus() 失败:",err.message);
      }
    },500);

    console.log(LOG_PREFIX,"openGame() 完成，共耗时:",performance.now().toFixed(0)+"ms");
  }

  function closeGame(){
    console.log(LOG_PREFIX,"closeGame() 触发",new Date().toISOString());
    console.log(LOG_PREFIX,"  gameModal 存在:",!!gameModal);
    if(gameModal){
      console.log(LOG_PREFIX,"  移除 .show 类 → 触发 CSS 渐出动画");
      gameModal.className="game-modal";
      if(gameIframe){
        var prevSrc=gameIframe.src;
        console.log(LOG_PREFIX,"  重新加载 iframe 以停止游戏循环，src:",prevSrc);
        gameIframe.src=gameIframe.src;
      }
      console.log(LOG_PREFIX,"closeGame() 完成");
    }else{
      console.warn(LOG_PREFIX,"closeGame() 跳过：gameModal 为空");
    }
  }

  preview.onclick=function(){
    console.log(LOG_PREFIX,"preview.onclick 触发 → openGame()");
    openGame();
  };
})();

(function(){
  var bar=$("progBar");
  function upd(){
    var h=document.documentElement;
    var max=h.scrollHeight-h.clientHeight;
    var p=max>0?Math.min(100,h.scrollTop/max*100):0;

  window.addEventListener("scroll",upd,{passive:true});

})();

/* ================= 复制邮箱 ================= */
var tt=null;
function showToast(m){
  var t=$("toast");
  t.innerHTML=ic("check")+" "+m;
  t.className="toast show";
  if(tt){window.clearTimeout(tt)}
  tt=window.setTimeout(function(){t.className="toast"},2200);
}
function copyText(t){
  var ok=false,ta;
  try{
    ta=document.createElement("textarea");
    ta.value=t;
    ta.setAttribute("readonly","");
    ta.style.position="fixed";
    ta.style.left="-9999px";
    document.body.appendChild(ta);
    ta.select();
    ok=document.execCommand("copy");
    document.body.removeChild(ta);
  }catch(e){ok=false}
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    try{navigator.clipboard.writeText(t);ok=true}catch(e2){}
  }
  return ok;
}
function copyEmail(btn){
  var em=email();
  copyText(em);
  var old=btn.innerHTML;
  btn.innerHTML=ic("check")+" 已复制";
  window.setTimeout(function(){btn.innerHTML=old},1600);
  showToast("邮箱已复制："+em);
}

/* ================= 动效 ================= */
(function(){
  var ts=document.querySelectorAll(".rv"),i;
  if(rm || !("IntersectionObserver" in window)){
    for(i=0;i<ts.length;i++){ts[i].className+=" in"}
    return;
  }
  var io=new IntersectionObserver(function(es){
    var j;
    for(j=0;j<es.length;j++){
      if(es[j].isIntersecting){
        es[j].target.className+=" in";
        io.unobserve(es[j].target);
      }
    }
  },{threshold:0.12});
  for(i=0;i<ts.length;i++){io.observe(ts[i])}
})();

(function(){
  if(!("IntersectionObserver" in window)){return}
  var ls=document.querySelectorAll(".nl[data-spy]");
  if(!ls.length){return}
  var io=new IntersectionObserver(function(es){
    var j,k;
    for(j=0;j<es.length;j++){
      if(es[j].isIntersecting){
        for(k=0;k<ls.length;k++){ls[k].className=ls[k].className.replace(" on","")}
        for(k=0;k<ls.length;k++){
          if(ls[k].getAttribute("data-spy")===es[j].target.id){ls[k].className+=" on"}
        }
      }
    }
  },{rootMargin:"-40% 0px -55% 0px"});
  var i,s;
  for(i=0;i<NAV.length;i++){
    s=document.getElementById(NAV[i].id);
    if(s){io.observe(s)}
  }
})();
